# CI has no GPU: the harness runs on / with Playwright Chromium (software GL), and GL, performance and Lighthouse
# evidence comes from the reference host (RX 6700 XT) through scripts/crew.mjs. The job `check` proves the build, the
# checks and the harness core on / (console, overflow at 320 px, contrast, keyboard, flash, axe), and (W-V0b) the D-055
# gating both ways, the state-machine smoke in Chromium and WebKit and the idle check on the engine's frame counters.
# The W-V1 browser suite runs beside it in the job `w-v1`, once per engine (a matrix: each entry builds the same commit
# and runs one engine's rows). The rows are state-sensitive and run on one worker, so a suite grows by jobs, never by
# workers: a later suite takes a job (or a matrix) of its own rather than stretching one job towards its cap.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # about 11 minutes (the W-V1 browser rows moved to the job w-v1)
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the ownership check diffs against origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Playwright deps' .deb files come from the Actions cache. On the runners whose apt mirror is
      # us-east-2.ec2.archive.ubuntu.com the deps (up to 185 packages, 139 MB) have downloaded at under 200 kB/s, 13 to 20
      # minutes and a job cancelled at its cap; with apt's archive folder in ~/apt-archives (one apt.conf.d line), a cache
      # hit installs from local files. The key names the image's release and the Playwright version, so either refreshes it.
      - name: Apt cache key (the runner image and Playwright)
        id: aptkey
        run: echo "key=apt-$ImageOS-$(. /etc/os-release && echo "$VERSION_CODENAME")-pw$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Apt cache for the Playwright deps (restore)
        id: apt
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.aptkey.outputs.key }}-chromium-webkit

      - name: Playwright Chromium and WebKit (harness and smoke on /)
        run: |
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/apt-archives/\";" | sudo tee /etc/apt/apt.conf.d/90-ci-archives
          npx playwright install --with-deps chromium webkit

      - name: Apt cache for the Playwright deps (save, on a miss)
        if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt.outputs.cache-primary-key }}

      - name: npm run check (build, astro check, lint, ownership, deps, size-limit, media-caps, ph-gate, CSS lint, tokens)
        run: npm run check -- --log check.log --json check.json

      - name: Unit tests (size-limit groups and the HTML / negative control, media-caps and its negative controls, console allowlist, tokens, host-load rules)
        run: npm run test:w-f-unit

      - name: Unit tests (D-055 test hooks both ways, with four mutants that must fail; the idle check's rules)
        run: npm run test:unit

      - name: Harness on / (content, contrast, flash self-test)
        run: |
          npm run h:content
          npm run h:contrast
          npm run h:flash -- --self-test

      # CI has no GPU: software GL renders the engine at 1 to 4 fps. The console gate loads / with WebGL (no error, no
      # GL_INVALID or CONTEXT_LOST, only the one allow-listed driver advisory). Every instrument that drives the page through
      # raise, frames, open and close runs with H_NO3D=1 (--disable-3d-apis: the page's flat-frame path), which is fast and
      # reaches every state. The reference host runs them all with GL.
      - name: Harness on / (console fault injection, then / with WebGL)
        run: npm run h:console

      - name: Harness on / (console driven through every state, overflow at 320 px, keyboard, axe)
        env:
          H_NO3D: '1'
        run: |
          npm run h:console -- --routes-only
          npm run h:overflow -- --profiles R1,P2,D2
          npm run h:keyboard -- --profiles D2
          npm run h:axe

      - name: Harness on / (flash analysis of the raise, fake clock; an empty capture fails)
        env:
          H_NO3D: '1'
        run: npm run h:flash -- --url /

      # W-V0b. With GL at G1 (640 x 400, DPR 1: a tenth of D2's pixels, so software GL keeps up): the state-machine
      # smoke and the gating check in Chromium and WebKit, with the frame counters asserted per step, then the idle check.
      - name: Smoke with GL at G1 (state machine and D-055 gating, Chromium and WebKit; counters per step)
        env:
          SMOKE_PROFILE: G1
          SMOKE_JSON: smoke-gl.json
        run: npm run test:smoke

      - name: Smoke on the flat-frame path (no WebGL in either engine)
        env:
          H_NO3D: '1'
          SMOKE_PROFILE: G1
          SMOKE_JSON: smoke-flat.json
        run: npm run test:smoke

      # W-V1 (#21): A1, A4 and A15 read dist here; the W-V1 browser rows run in the job w-v1, one engine per entry.
      - name: W-V1 tests (dist; the browser rows run in the job w-v1)
        run: npm run test:w-v1-dist

      - name: Idle check with GL at G1 (frame counters at rest, hidden and reduced; Chromium trace cross-check)
        run: npm run h:idle -- --profile G1 --window 5 --browsers chromium,webkit --out idle.json

      # The negative control: --plant hot keeps the engine drawing; the idle check must FAIL on the plant (the reduced EVF
      # draws > 0 frames). This step fails when the planted run passes, crashes or fails on anything else.
      - name: Idle negative control (the planted hot run must fail)
        run: npm run h:idle:negative -- --profile G1 --window 3 --browsers chromium --out idle-negative.json

      - name: Crew-loop self-test (the lean loop's rules on a stubbed loop, each with a negative control; no agents)
        run: node scripts/fleet/loop/crew-loop.check.cjs --self-test --offline

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ github.sha }}
          path: |
            check.log
            check.json
            smoke-gl.json
            smoke-flat.json
            idle.json
            idle-negative.json
          if-no-files-found: ignore
          overwrite: true # a re-run attempt replaces the earlier attempt's logs

  # W-V1 (#21): the project pages and the film prints, in Chromium and WebKit, one engine per matrix entry (each about 13
  # minutes). A2 and A5 to A13 run on the flat path (WebGL off), DOM only, at 1440 x 900 and 390 x 844; A14 and the GL
  # rows (A7's zoom and close, the resize during the open, the cold page's dim) with GL at 640 x 400, DPR 1. The GL row at
  # 1440 x 900 (one focal-length readout over the open's landing) runs only on hardware GL: it skips here and runs on the
  # reference host. Its own build of the commit, so the entry needs nothing from the job check.
  w-v1:
    name: w-v1 (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # one engine's failure keeps the other's rows and logs
      matrix:
        engine: [chromium, webkit]
    env:
      CI: 'true'
      W_V1_JSON: ${{ github.workspace }}/w-v1-${{ matrix.engine }}.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # the Playwright deps' .deb files from the Actions cache, as in the job check
      - name: Apt cache key (the runner image and Playwright)
        id: aptkey
        run: echo "key=apt-$ImageOS-$(. /etc/os-release && echo "$VERSION_CODENAME")-pw$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Apt cache for the Playwright deps (restore)
        id: apt
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.aptkey.outputs.key }}-${{ matrix.engine }}

      - name: Playwright ${{ matrix.engine }}
        run: |
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/apt-archives/\";" | sudo tee /etc/apt/apt.conf.d/90-ci-archives
          npx playwright install --with-deps ${{ matrix.engine }}

      - name: Apt cache for the Playwright deps (save, on a miss)
        if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt.outputs.cache-primary-key }}

      - name: Build (dist for the suite's server)
        run: npm run build

      - name: W-V1 tests in ${{ matrix.engine }} (prints, open, playback and calm on the flat path; idle and GL rows at G1)
        run: npx playwright test -c tests/w-v1/playwright.config.mjs --project ${{ matrix.engine }}

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w-v1-${{ matrix.engine }}-${{ github.sha }}
          path: w-v1-${{ matrix.engine }}.json
          if-no-files-found: ignore
          overwrite: true # a re-run attempt replaces the earlier attempt's logs
