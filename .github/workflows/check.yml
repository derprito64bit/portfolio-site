# CI has no GPU: the harness runs on / with Playwright Chromium (software GL), and GL, performance and Lighthouse
# evidence comes from the reference host (RX 6700 XT) through scripts/crew.mjs. This job proves the build, the checks and
# the harness core on / (console, overflow at 320 px, contrast, keyboard, flash, axe).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the ownership check diffs against origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Playwright Chromium (harness on /)
        run: npx playwright install --with-deps chromium

      - name: npm run check (build, astro check, lint, ownership, deps, size-limit, media-caps, ph-gate, CSS lint, tokens)
        run: npm run check -- --log check.log --json check.json

      - name: Unit tests (size-limit groups and the HTML / negative control, media-caps and its negative controls, console allowlist, tokens, host-load rules)
        run: npm run test:w-f-unit

      - name: Harness on / (content, contrast, flash self-test)
        run: |
          npm run h:content
          npm run h:contrast
          npm run h:flash -- --self-test

      # CI has no GPU: software GL renders the engine at 1 to 4 fps. The console gate loads / with WebGL (no error, no
      # GL_INVALID or CONTEXT_LOST, only the one allow-listed driver advisory). Every instrument that drives the page through
      # raise, frames, open and close runs with H_NO3D=1 (--disable-3d-apis: the page's flat-frame path), which is fast and
      # reaches every state. The reference host runs them all with GL.
      - name: Harness on / (console: fault injection, then / with WebGL)
        run: npm run h:console

      - name: Harness on / (console driven through every state, overflow at 320 px, keyboard, axe)
        env:
          H_NO3D: '1'
        run: |
          npm run h:console -- --routes-only
          npm run h:overflow -- --profiles R1,P2,D2
          npm run h:keyboard -- --profiles D2
          npm run h:axe

      - name: Harness on / (flash analysis of the raise, fake clock; an empty capture fails)
        env:
          H_NO3D: '1'
        run: npm run h:flash -- --url /

      - name: Crew-loop self-test (the lean loop's rules on a stubbed loop, each with a negative control; no agents)
        run: node scripts/fleet/loop/crew-loop.check.cjs --self-test --offline

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ github.sha }}
          path: |
            check.log
            check.json
          if-no-files-found: ignore
